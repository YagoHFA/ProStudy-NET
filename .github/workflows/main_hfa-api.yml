name: Build and deploy ASP.Net Core app to Azure Web App - hfa-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependecies
        run: dotnet restore src/ProStudy-NET.csproj
        
      - name: Build with dotnet
        run: dotnet build src/ProStudy-NET.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish src/ProStudy-NET.csproj -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D3DBAE6827E848E89ED6ACF9746DDF0A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DBD44BD1C9274A7B86DB2C59822BC0D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_59BC8F6BC8DC49CBBDF57FAB2F20B5A4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hfa-api'
          slot-name: 'Production'
          package: .

